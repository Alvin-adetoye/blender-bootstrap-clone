<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="top-nav text-center p-2">
      <a href="" class="top-link"
        >Join the
        <span class="top-link-span fw-bold"
          >official Blender Survey 2026!
          <img src="images/orange-heart.svg" alt="" width="20" /></span
      ></a>
    </div>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid nav-cont d-flex justify-content-between">
        <a class="navbar-brand" href="#"
          ><img src="images/logo.svg" alt="" width="120"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse"
          id="navbarSupportedContent"
        >
          <div
            class="nav-right d-flex ms-auto flex-column flex-lg-row gap-3 text-start align-items-lg-center"
            role="search"
          >
            <a href="#" class="nav-liks text-decoration-none">Roadmap</a>
            <a href="#" class="nav-liks text-decoration-none">Download</a>
            <a href="#" class="nav-liks text-decoration-none">Support</a>
            <a href="#" class="nav-liks text-decoration-none">Get Involved</a>
            <a href="#" class="nav-liks text-decoration-none">About</a>
            <a href="#" class="nav-liks text-decoration-none">Store</a>
            <a href="#" class="d-flex rounded-2 align-items-center gap-1" title="Join the Develpment Fund"
              ><img src="images/heart2.svg" alt="" width="14" /><span>
                Donate</span
              ></a
            >
          </div>
        </div>
      </div>
    </nav>

    <main>
      <section class="hero">
        <div class="container hero-cont">
            <h1>Blender 5.3 Beta</h1>
            <p>
              NVIDIA RTX Spark-ready with support for DLSS denoising, Gaussian
              Splatting, and much more!
            </p>
            <div class="hero-links">
              <a href="#">What's Coming</a>
              <a href="#">Download & Test</a>
            </div>
        </div>
      </section>

      <section class="container latest-news-section row">
        <a href="#">Latest News</a>
        <div class="news-cont ">
          <div>
            <img src="images/" alt="">
          </div>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
